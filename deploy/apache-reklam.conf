<VirtualHost *:80>
    ServerName reklam.yourdomain.com
    # Если нет домена, используйте IP:
    # ServerName YOUR_VPS_IP

    # Reverse proxy к Node.js приложению
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3333/
    ProxyPassReverse / http://127.0.0.1:3333/

    # WebSocket поддержка (для live-обновлений)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3333/$1 [P,L]

    # Логи
    ErrorLog ${APACHE_LOG_DIR}/reklam-error.log
    CustomLog ${APACHE_LOG_DIR}/reklam-access.log combined
</VirtualHost>
